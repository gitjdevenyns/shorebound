<!--
  Shorebound app icon — "inversion".

  The waterline is read by what it CHANGES rather than what it draws: the snook
  flips from lime to navy the instant it crosses. One shape, two readings — a
  fish, and the surface of the water — which is what the app is for.

  Source of truth for every rasterised size in public/assets. Full-bleed and
  square on purpose: the stores apply their own mask, and a pre-rounded icon
  gets rounded twice.

  Locked brand values only: key lime #8dff00, deep navy #031530.
-->
