<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Theme-aware browser chrome: the app's real page background in each
         theme (tokens --bg: n99 dark / n10 light), not the brand accent. -->
    <meta name="theme-color" content="#f3f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05080d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shorebound" />
    <meta
      name="description"
      content="Shore fishing guide for Florida's Gulf coast — 25 researched spots, live tide, and the rig for each one. Works offline."
    />
    <title>Shorebound — Shore Fishing Guide</title>
    <!-- The SVG is the source the PNGs are rendered from, and doubles as a
         crisp favicon at any tab size. -->
    <link rel="icon" href="/assets/icon-mark.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/assets/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <script>
      // Apply persisted theme before first paint (default: dark).
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
