# NOTE: the app now builds with base '/' for its own domain, so this
# workflow's output cannot resolve at gitjdevenyns.github.io/shorebound/
# — asset URLs are absolute from the root. Hosting moved to Cloudflare
# Pages. Kept as a fallback: it works again the moment a custom domain is
# attached to GitHub Pages, which serves at root.
# Build and deploy GCF to GitHub Pages (Actions mode).
#
# IMPORTANT: This workflow only takes effect once the repository's Pages
# setting is flipped from "Deploy from a branch" to "GitHub Actions".
# Until then the live site is served from the main branch root (legacy mode).
#
# Optional Supabase configuration (needed later for cached weather/tide
# snapshots): set these in the repo before/when that feature ships —
#   - Actions secret  VITE_SUPABASE_ANON_KEY  (publishable anon key ONLY —
#     never the service role key; it must not exist anywhere in this repo)
#   - Actions variable (or secret) VITE_SUPABASE_URL
# The build works fine without them; the app treats Supabase as optional.
name: Deploy to GitHub Pages

# Manual only. This used to fire on every push to main, which is how the
# tests, typecheck and secret grep ended up gating a target nothing serves
# while production shipped past them unchecked. Those checks now live in
# ci.yml. This stays because it works again the moment a custom domain is
# attached to GitHub Pages — but it no longer pretends to be the gate.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast on a broken suite before spending time on a bundle we'd throw away.
      - name: Run tests
        run: npm test

      - name: Check Supabase build configuration
        env:
          URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning title=Supabase not configured::Building without \
          VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY. The guide still works \
          offline-first, but every live tide and weather slot will render in \
          its 'unavailable' state."
          fi

      - name: Build (typecheck + vite build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # The anon key is publishable and expected in the bundle; the service role
      # key and the Anthropic key must never be. Both are server-only: the
      # service role is injected into the Edge Function runtime, and
      # ANTHROPIC_API_KEY is a Supabase Function secret read inside
      # supabase/functions/identify-fish. Neither has any reason to appear in a
      # client build, so any sighting is a leak — fail rather than publish it.
      - name: Assert no server-only secrets in the bundle
        run: |
          if grep -rlE 'service_role|SUPABASE_SERVICE_ROLE_KEY|ANTHROPIC|sk-ant-' dist/ ; then
            echo "::error title=Secret leak::A server-only key reference reached dist/."
            exit 1
          fi
          echo "No service-role or Anthropic references in dist/."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
